version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "Monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Agrupar minor/patch juntos
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"


      # Si usas GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
    interval: "weekly"