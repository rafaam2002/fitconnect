name: _ Internal Lint
on:
  workflow_call:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Pro-tip: El lint no debería tardar más de 5 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Pro-tip: No necesitamos el historial para el lint
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint & Format
        run: |
          yarn lint
          yarn format:check
          
      - name: Type Check
        run: npx tsc --noEmit

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4 # v4.4.3
        with:
          name: lint-report
          path: eslint-report.json
          retention-days: 1