name: SonarCloud Scan
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
        description: "Token para autenticarse con sonarCloud"

jobs:
  sonar-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Lint Report
        uses: actions/download-artifact@v4 # v4.1.8
        with:
          name: lint-report
          path: reports/lint-report/

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifact
          path: reports/coverage-artifact/

      # 2. Cache para no descargar el motor de Sonar cada vez
      - name: SonarCloud Cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 3. Escaneo (Sin ejecutar tests)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}